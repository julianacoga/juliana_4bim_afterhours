
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | After Hours</title>
    <link rel="stylesheet" href="cadastro.css">
</head>

<body>

    <div class="master-container">

        <div class="form-container">
            <h2>Criar conta</h2>
            <p>Faça seu cadastro para aproveitar os eventos do After Hours!</p>

            <form id="formCadastro">

                <label for="nome_pessoa">Nome completo</label>
                <input
                    type="text"
                    id="nome_pessoa"
                    name="nome_pessoa"
                    placeholder="Digite seu nome completo"
                    required
                >

                <label for="cpf_pessoa">CPF</label>
                <input
                    type="text"
                    id="cpf_pessoa"
                    name="cpf_pessoa"
                    placeholder="000.000.000-00"
                    maxlength="14"
                    required
                >

                <label for="data_nascimento_pessoa">Data de nascimento</label>
                <input
                    type="date"
                    id="data_nascimento_pessoa"
                    name="data_nascimento_pessoa"
                >

                <label for="genero_pessoa">Gênero</label>
                <select id="genero_pessoa" name="genero_pessoa">
                    <option value="">Selecione</option>
                    <option value="Feminino">Feminino</option>
                    <option value="Masculino">Masculino</option>
                    <option value="Outro">Outro</option>
                    <option value="Prefiro não informar">Prefiro não informar</option>
                </select>

                <label for="email_pessoa">E-mail</label>
                <input
                    type="email"
                    id="email_pessoa"
                    name="email_pessoa"
                    placeholder="Digite seu e-mail"
                    required
                >

                <label for="telefone_pessoa">Telefone</label>
                <input
                    type="tel"
                    id="telefone_pessoa"
                    name="telefone_pessoa"
                    placeholder="(00) 00000-0000"
                >

                <label for="senha_pessoa">Senha</label>
                <input
                    type="password"
                    id="senha_pessoa"
                    name="senha_pessoa"
                    placeholder="Crie uma senha"
                    minlength="8"
                    required
                >

                <label for="confirmar_senha">Confirmar senha</label>
                <input
                    type="password"
                    id="confirmar_senha"
                    name="confirmar_senha"
                    placeholder="Digite a senha novamente"
                    minlength="8"
                    required
                >

                <button type="submit">Criar conta</button>

            </form>

            <div id="mensagem"></div>

            <p>
                Já possui uma conta?
                <a href="../login/login.html">Fazer login</a>
            </p>

        </div>

    </div>

    <script src="cadastro.js"></script>

</body>
</html>
