
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Categorias</title>
    <link rel="stylesheet" href="categoria.css">
</head>

<body onload="listar()">

    <header>
        <a href="../menu/menu.html" class="btn-voltar">
            ← Voltar ao menu
        </a>

        <h1>Cadastro de Categorias</h1>
        <p>Gerencie as categorias do sistema.</p>
    </header>

    <main class="container-master">
        <div class="conteudo-principal">
            <section class="form-esquerda">
                <h2>Dados da categoria</h2>

                <label for="inputId_categoria">ID da categoria:</label>
                <div class="linha-id">
                    <input
                        type="number"
                        name="inputId_categoria"
                        id="inputId_categoria"
                        placeholder="Digite o ID para pesquisar"
                    >

                    <input type="button" value="Procure" id="btProcure" onclick="procure()">
                    <input type="button" value="Inserir" id="btInserir" onclick="inserir()">
                    <input type="button" value="Alterar" id="btAlterar" onclick="alterar()" style="display:none;">
                    <input type="button" value="Excluir" id="btExcluir" onclick="excluir()" style="display:none;">
                </div>

                <label for="inputNome_categoria">Nome da Categoria:</label>
                <input
                    type="text"
                    name="inputNome_categoria"
                    id="inputNome_categoria"
                    placeholder="Ex: Shows"
                >

                <div id="divAviso">
                    Digite um ID para pesquisar ou clique em Inserir para cadastrar.
                </div>

                <div class="botoes-acao">
                    <input type="button" value="Salvar" id="btSalvar" onclick="salvar()" style="display:none;">
                    <input type="button" value="Cancelar" id="btCancelar" onclick="cancelarOperacao()" style="display:none;">
                </div>
            </section>
        </div>

        <section class="lista-categorias">
            <h3>Categorias Cadastradas</h3>
            <div id="outputSaida">Carregando...</div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 After Hours. Todos os direitos reservados.<br>Juliana Coga - M32 2026</p>
    </footer>

    <script src="./categoria.js"></script>

</body>
</html>
