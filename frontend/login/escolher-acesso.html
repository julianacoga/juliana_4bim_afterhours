
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escolher acesso | After Hours</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            width: min(90%, 650px);
            text-align: center;
        }

        .logo {
            color: #ff803d;
            font-weight: 900;
            letter-spacing: 3px;
            margin-bottom: 40px;
        }

        h1 { font-size: 36px; margin-bottom: 12px; }

        p { color: #aaa; }

        .opcoes {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 35px;
        }

        .opcao {
            padding: 35px 20px;
            background: #1c1c1c;
            border: 1px solid #383838;
            border-radius: 16px;
            color: white;
            text-decoration: none;
            transition: 0.2s;
        }

        .opcao:hover {
            border-color: #ff803d;
            transform: translateY(-4px);
        }

        .icone {
            font-size: 36px;
            margin-bottom: 18px;
        }

        .opcao h2 { font-size: 20px; }
        .opcao p { font-size: 14px; }

        @media (max-width: 550px) {
            .opcoes { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="logo">AFTER HOURS.</div>

        <h1>Como deseja entrar?</h1>
        <p>Escolha a área que deseja acessar.</p>

        <div class="opcoes">
            <a href="/menu" class="opcao">
                <div class="icone">⚙</div>
                <h2>Administração</h2>
                <p>Gerenciar eventos, ingressos e pedidos.</p>
            </a>

            <a href="/login/visaocliente" class="opcao">
                <div class="icone">♫</div>
                <h2>Área do cliente</h2>
                <p>Explorar eventos e comprar ingressos.</p>
            </a>
        </div>
    </main>
</body>
</html>
