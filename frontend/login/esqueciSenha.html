
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha | After Hours</title>
    <link rel="stylesheet" href="./recuperarSenha.css">
</head>

<body>

    <main class="master-container">
        <div class="form-container">

            <a href="/login" class="logo">
                AFTER<span>HOURS.</span>
            </a>

            <span class="etiqueta">RECUPERAÇÃO DE CONTA</span>

            <h2>Esqueceu sua senha?</h2>

            <p>Não se preocupe! Informe seu e-mail para recuperar o acesso à sua conta.</p>

            <form id="formRecuperacao">

                <label for="email">E-mail</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required
                >

                <button type="submit" id="botaoEnviar">
                    ENVIAR LINK ↗
                </button>

            </form>

            <div id="mensagem" role="status"></div>

            <a href="/login" class="voltar">
                ← Voltar para o login
            </a>

        </div>
    </main>

    <script src="./esqueciSenha.js"></script>

</body>
</html>
