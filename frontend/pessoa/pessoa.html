
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD - Pessoa</title>
    <link rel="stylesheet" href="./pessoa.css">
    <script src="./pessoa.js" defer></script>
</head>

<body>
    <header>
        <h1>CRUD Pessoa</h1>
    </header>

    <main>
        <section class="form-section">
            <h2>Cadastro de Pessoa</h2>

            <form id="pessoaForm">
                <div class="search-container">
                    <label for="searchId">Buscar por CPF:</label>

                    <div class="search-input-group">
                        <input
                            type="text"
                            id="searchId"
                            placeholder="Digite o CPF para buscar"
                            maxlength="14"
                            inputmode="numeric"
                        >

                        <button type="button" id="btnBuscar">🔍 Buscar</button>
                        <button type="button" id="btnIncluir" class="btn-primary">Cadastrar</button>
                        <button type="button" id="btnAlterar" class="btn-secondary" style="display: none;">Alterar</button>
                        <button type="button" id="btnExcluir" class="btn-danger" style="display: none;">Excluir</button>
                        <button type="button" id="btnSalvar" class="btn-save" style="display: none;">Salvar</button>
                        <button type="button" id="btnCancelar" class="btn-cancel" style="display: none;">Cancelar</button>
                    </div>
                </div>

                <fieldset id="formFields" disabled>
                    <legend>Dados da Pessoa</legend>

                    <div class="form-group">
                        <label for="nome_pessoa">Nome:</label>
                        <input type="text" id="nome_pessoa" name="nome_pessoa" required>
                    </div>

                    <div class="form-group">
                        <label for="data_nascimento">Data de Nascimento:</label>
                        <input type="date" id="data_nascimento" name="data_nascimento">
                    </div>

                    <div class="form-group">
                        <label for="genero_pessoa">Gênero:</label>
                        <select id="genero_pessoa" name="genero_pessoa" required>
                            <option value="">Selecione</option>
                            <option value="feminino">Feminino</option>
                            <option value="masculino">Masculino</option>
                            <option value="nao_informar">Prefiro não dizer</option>
                            <option value="outro">Outro...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="senha_pessoa">Senha:</label>
                        <input
                            type="password"
                            id="senha_pessoa"
                            name="senha_pessoa"
                            autocomplete="new-password"
                            placeholder="Preencha para cadastrar ou alterar"
                        >
                    </div>

                    <div class="form-group">
                        <label for="email_pessoa">Email:</label>
                        <input type="email" id="email_pessoa" name="email_pessoa" required>
                    </div>

                    <div class="form-group">
                        <label for="telefone_pessoa">Telefone:</label>
                        <input type="tel" id="telefone_pessoa" name="telefone_pessoa" required>
                    </div>
                </fieldset>
            </form>

            <div class="umParaum">
                <div class="funcionario">
                    <input type="checkbox" id="checkboxFuncionario" disabled>
                    <label for="checkboxFuncionario">Funcionário</label>

                    <select id="cargo_id_cargo" disabled>
                        <option value="">Cargo</option>
                    </select>

                    <label for="salario_funcionario">Salário</label>
                    <input
                        type="number"
                        id="salario_funcionario"
                        placeholder="Salário"
                        min="0"
                        step="0.01"
                        disabled
                    >
                </div>

                <div class="cliente">
                    <input type="checkbox" id="checkboxCliente" disabled>
                    <label for="checkboxCliente">Cliente</label>

                    <label for="data_cadastro_cliente">Data de cadastro</label>
                    <input type="date" id="data_cadastro_cliente" disabled>
                </div>
            </div>
        </section>

        <section class="list-section">
            <div class="table-container">
                <table id="pessoasTable">
                    <thead>
                        <tr>
                            <th>CPF</th>
                            <th>Nome</th>
                            <th>Data Nascimento</th>
                            <th>Gênero</th>
                            <th>Email</th>
                            <th>Telefone</th>
                        </tr>
                    </thead>

                    <tbody id="pessoasTableBody">
                        <!-- Dados carregados pelo JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 Sistema CRUD pessoas. Todos os direitos reservados.<br>Juliana Coga - M32 2026</p>
    </footer>

    <div id="messageContainer" class="message-container"></div>
</body>

</html>
