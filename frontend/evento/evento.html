
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Eventos | After Hours</title>
    <link rel="stylesheet" href="evento.css">
</head>

<body onload="inicializar()">

    <header>
        <h1>Cadastro de eventos</h1>
        <p>Gerencie os eventos do After Hours.</p>
    </header>

    <main class="container-master">

        <div class="conteudo-principal">

            <section class="form-esquerda">

                <h2>Dados do evento</h2>

                <label for="inputId_evento">ID do evento</label>

                <div class="linha-id">
                    <input type="text" name="inputId_evento"
                        id="inputId_evento" placeholder="Ex: 1">

                    <input type="button" value="Procure"
                        id="btProcure" onclick="procure()">

                    <input type="button" value="Inserir"
                        id="btInserir" onclick="inserir()"
                        style="display:none;">

                    <input type="button" value="Alterar"
                        id="btAlterar" onclick="alterar()"
                        style="display:none;">

                    <input type="button" value="Excluir"
                        id="btExcluir" onclick="excluir()"
                        style="display:none;">
                </div>

                <label for="inputTitulo_evento">Título do evento</label>
                <input type="text"
                    name="inputTitulo_evento"
                    id="inputTitulo_evento"
                    placeholder="Ex: Festival de Música">

                <label for="inputDescricao_evento">Descrição</label>
                <textarea
                    name="inputDescricao_evento"
                    id="inputDescricao_evento"
                    placeholder="Descreva o evento"></textarea>

                <label for="selectId_categoria">Categoria</label>
                <select name="selectId_categoria"
                    id="selectId_categoria" disabled>
                    <option value="">Carregando...</option>
                </select>

                <label for="inputLocal_evento">Local</label>
                <input type="text"
                    name="inputLocal_evento"
                    id="inputLocal_evento"
                    placeholder="Ex: Parque de Exposições">

                <label for="inputEndereco_evento">Endereço</label>
                <input type="text"
                    name="inputEndereco_evento"
                    id="inputEndereco_evento"
                    placeholder="Endereço completo do evento">

                <label for="inputData_evento">Data do evento</label>
                <input type="date"
                    name="inputData_evento"
                    id="inputData_evento">

                <label for="inputHorario_evento">Horário</label>
                <input type="time"
                    name="inputHorario_evento"
                    id="inputHorario_evento">

                <label for="selectStatus_evento">Status do evento</label>
                <select name="selectStatus_evento"
                    id="selectStatus_evento">
                    <option value="Ativo">Ativo</option>
                    <option value="Inativo">Inativo</option>
                    <option value="Cancelado">Cancelado</option>
                </select>

                <label for="inputFuncionario_evento">
                    CPF do funcionário responsável
                </label>

                <input type="text"
                    name="inputFuncionario_evento"
                    id="inputFuncionario_evento"
                    placeholder="CPF do funcionário responsável">

                <div id="divAviso">
                    Informe o ID e clique em Procure
                </div>

                <div class="botoes-acao">

                    <input type="button"
                        value="Salvar"
                        id="btSalvar"
                        onclick="salvar()"
                        style="display:none;">

                    <input type="button"
                        value="Cancelar"
                        id="btCancelar"
                        onclick="cancelarOperacao()"
                        style="display:none;">

                </div>

            </section>

            <aside class="form-direita">

                <h2>Imagem do evento</h2>

                <p class="instrucao-imagem">
                    (Clique na imagem para alterar)
                </p>

                <div class="img-container">

                    <img
                        id="imgevento"
                        src="http://localhost:3001/imagens/silhueta.png"
                        alt="Imagem do evento"
                        onclick="acionarUpload()">

                    <input
                        type="file"
                        id="inputImagem"
                        accept="image/*"
                        style="display:none;"
                        onchange="previewImagem()">

                </div>

            </aside>

        </div>

        <section class="lista-evento">

            <h3>Eventos cadastrados</h3>

            <div id="outputSaida">
                Carregando...
            </div>

        </section>

    </main>

    <footer>
        <p>
            &copy; 2026 After Hours. Todos os direitos reservados.
            <br>
            Juliana Coga - M32 2026
        </p>
    </footer>

    <script src="./evento.js"></script>

</body>
</html>
